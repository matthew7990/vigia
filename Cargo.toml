[workspace]
resolver = "2"
members = [
    "crates/actions",
    "crates/charset",
    "crates/css",
    "crates/dom",
    "crates/html",
    "crates/inflate",
    "crates/json",
    "crates/js",
    "crates/mem",
    "crates/net",
    "crates/run",
    "crates/session",
    "crates/snapshot",
    "crates/tls",
    "crates/url",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/matthew7990/vigia"
rust-version = "1.75"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
